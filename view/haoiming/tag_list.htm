{inc:header.htm}

<div class="page-hero">
	<div class="wrap"><h1>标签：{$tagname}</h1><p>该标签下的全部内容</p></div>
</div>

<div class="page-body wrap">
	{block:global_taglist pagenum="10" dateformat="Y-m-d" showviews="1"}{/block}
	<div class="art-list">
		{loop:$gdata[list] $v}
		<a class="art-item" href="{$v[url]}">
			<div class="art-item-body">
				<h3>{$v[subject]}</h3>
				<div class="art-item-meta">{$v[date]} · 阅读 {$v[views]}</div>
			</div>
		</a>
		{/loop}
		{if:empty($gdata[list])}<p class="empty">暂无内容。</p>{/if}
		{if:$gdata[pages]}<div class="pagebar">{$gdata[pages]}</div>{/if}
	</div>
</div>

{inc:footer.htm}
