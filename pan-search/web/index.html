<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#b46aff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="盘搜 PanSearch - 聚合百度网盘、阿里云盘、夸克网盘、迅雷云盘资源搜索引擎，一搜即达海量影视、软件、图书、音乐等网盘资源" />
    <meta name="keywords" content="网盘搜索,百度网盘,阿里云盘,夸克网盘,迅雷云盘,资源搜索,PanSearch,盘搜,影视资源,软件资源,图书资源" />
    <meta name="author" content="PanSearch" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pansearch.example.com/" />
    <meta property="og:title" content="盘搜 PanSearch - 网盘资源搜索引擎" />
    <meta property="og:description" content="聚合百度网盘、阿里云盘、夸克网盘、迅雷云盘资源搜索引擎，一搜即达海量影视、软件、图书、音乐等网盘资源" />
    <meta property="og:image" content="https://pansearch.example.com/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://pansearch.example.com/" />
    <meta property="twitter:title" content="盘搜 PanSearch - 网盘资源搜索引擎" />
    <meta property="twitter:description" content="聚合百度网盘、阿里云盘、夸克网盘、迅雷云盘资源搜索引擎，一搜即达海量影视、软件、图书、音乐等网盘资源" />
    <meta property="twitter:image" content="https://pansearch.example.com/og-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://pansearch.example.com/" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "盘搜 PanSearch",
      "url": "https://pansearch.example.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://pansearch.example.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "PanSearch",
      "url": "https://pansearch.example.com/",
      "logo": "https://pansearch.example.com/logo.png",
      "sameAs": [
        "https://github.com/pansearch"
      ]
    }
    </script>

    <title>盘搜 PanSearch - 网盘资源搜索引擎</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
