<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>{$cfg[titles]}</title>
    <meta name="description" content="{$cfg[seo_description]}">
    <meta name="keywords" content="{$cfg[seo_keywords]}">
    <meta name="applicable-device" content="mobile">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="{$cfg[webdir]}favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="{$cfg[tpl]}style/css/style.css">
</head>
<body>
<div class="windows-homepage-module__n3qHYq__page">
<header class="windows-homepage-module__n3qHYq__topbar">
    <div class="windows-homepage-module__n3qHYq__topbarContent">
        <div class="windows-homepage-module__n3qHYq__topbarMain">
            <a class="windows-homepage-module__n3qHYq__brand" href="{$cfg[weburl]}">
                <img alt="MacFk" class="windows-homepage-module__n3qHYq__brandLogo" draggable="false" src="{$cfg[tpl]}style/img/windows-store-logo.svg"/>
                <span class="windows-homepage-module__n3qHYq__brandSeparator"></span>
                <span class="windows-homepage-module__n3qHYq__brandStore">Store</span>
            </a>
            <button aria-label="菜单" class="windows-homepage-module__n3qHYq__mobileMenuButton" type="button">
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><line x1="3" x2="21" y1="12" y2="12"></line><line x1="3" x2="21" y1="6" y2="6"></line><line x1="3" x2="21" y1="18" y2="18"></line></svg>
            </button>
            <nav class="windows-homepage-module__n3qHYq__topnav ">
                <div class="windows-homepage-module__n3qHYq__topnavItem"><a class="windows-homepage-module__n3qHYq__topnavLink{if:$cfg_var[topcid] == 92 || $cfg_var[topcid] == 0} windows-homepage-module__n3qHYq__topnavLinkActive{/if} " href="{$cfg[weburl]}"><span>首页</span></a></div>
                <div class="windows-homepage-module__n3qHYq__topnavItem"><a class="windows-homepage-module__n3qHYq__topnavLink{if:$cfg_var[topcid] == 93} windows-homepage-module__n3qHYq__topnavLinkActive{/if} " href="{$cfg[weburl]}winoffice/"><span>办公</span></a></div>
                <div class="windows-homepage-module__n3qHYq__topnavItem"><a class="windows-homepage-module__n3qHYq__topnavLink{if:$cfg_var[topcid] == 94} windows-homepage-module__n3qHYq__topnavLinkActive{/if} " href="{$cfg[weburl]}winmedia/"><span>媒体</span></a></div>
                <div class="windows-homepage-module__n3qHYq__topnavItem"><a class="windows-homepage-module__n3qHYq__topnavLink{if:$cfg_var[topcid] == 95} windows-homepage-module__n3qHYq__topnavLinkActive{/if} " href="{$cfg[weburl]}windesign/"><span>设计</span></a></div>
                <div class="windows-homepage-module__n3qHYq__topnavItem"><a class="windows-homepage-module__n3qHYq__topnavLink{if:$cfg_var[topcid] == 96} windows-homepage-module__n3qHYq__topnavLinkActive{/if} " href="{$cfg[weburl]}winmotion/"><span>影视</span></a></div>
                <div class="windows-homepage-module__n3qHYq__topnavItem"><a class="windows-homepage-module__n3qHYq__topnavLink{if:$cfg_var[topcid] == 97} windows-homepage-module__n3qHYq__topnavLinkActive{/if} " href="{$cfg[weburl]}winsystem/"><span>系统</span></a></div>
                <div class="windows-homepage-module__n3qHYq__topnavItem"><a class="windows-homepage-module__n3qHYq__topnavLink windows-homepage-module__n3qHYq__topnavActionButton windows-homepage-module__n3qHYq__topnavLinkSoftwareRequest" href="{$cfg[weburl]}addsoft/"><span>软件申请</span></a></div>
                <div class="windows-homepage-module__n3qHYq__topnavItem"><a class="windows-homepage-module__n3qHYq__topnavLink windows-homepage-module__n3qHYq__topnavLinkMacHome" href="{$cfg[weburl]}"><span>访问 Mac 首页</span></a></div>
            </nav>
        </div>
        <div class="windows-homepage-module__n3qHYq__topbarEnd">
            <form class="windows-homepage-module__n3qHYq__searchShell" role="search" action="{$cfg[webdir]}search/mid_6/" method="get" onsubmit="var k=this.querySelector('input[name=keyword]').value;if(k){this.action='{$cfg[webdir]}search/mid_6/'+encodeURIComponent(k)+'/';return true;}return false;">
                <button aria-label="搜索" class="windows-homepage-module__n3qHYq__searchIconButton" type="submit">
                    <svg aria-hidden="true" class="windows-homepage-module__n3qHYq__searchIcon" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="4.75" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M12.2 12.2L16.25 16.25" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"></path></svg>
                </button>
                <input aria-label="搜索 Windows 应用" class="windows-homepage-module__n3qHYq__searchInput" placeholder="搜索 Windows 应用" type="search" name="keyword" value="{$keyword}"/>
            </form>
            <a class="windows-homepage-module__n3qHYq__accountButton" href="{$cfg[weburl]}contact/">
                <span class="windows-homepage-module__n3qHYq__accountButtonText">联系</span>
                <span aria-hidden="true" class="windows-homepage-module__n3qHYq__accountButtonIconWrap"><img alt="" class="windows-homepage-module__n3qHYq__accountButtonIcon" draggable="false" src="{$cfg[tpl]}style/img/person-loggedout-dark.svg"/></span>
            </a>
        </div>
    </div>
</header>
<div class="windows-homepage-module__n3qHYq__supportDock">
    <a aria-label="联系客服" class="windows-homepage-module__n3qHYq__supportBubble" href="{$cfg[weburl]}contact/">
        <span class="windows-homepage-module__n3qHYq__supportBubbleGlyph"><svg fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="22"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></span>
        <span class="windows-homepage-module__n3qHYq__supportBubbleText"><strong>联系客服</strong><span>微信客服</span></span>
    </a>
</div>
