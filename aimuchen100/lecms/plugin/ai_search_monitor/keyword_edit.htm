{inc:header.htm}
<div class="layuimini-container">
	<div class="layui-main">
		<div class="layui-card">
			<div class="layui-card-header">添加品牌词</div>
			<div class="layui-card-body">
				<form id="form" class="layui-form" action="?keyword-edit_post-ajax-1" method="post">
					<input type="hidden" name="FORM_HASH" value="{@form_hash()}" />
					<div class="layui-form-item">
						<label class="layui-form-label required">品牌词</label>
						<div class="layui-input-block">
							<input type="text" name="keyword" class="layui-input" lay-verify="required" lay-reqtext="品牌词不能为空" placeholder="请输入品牌词" />
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">监测平台</label>
						<div class="layui-input-block">
							<input type="checkbox" name="platforms[]" value="baidu_wenxin" title="文心一言" checked>
							<input type="checkbox" name="platforms[]" value="doubao" title="豆包" checked>
							<input type="checkbox" name="platforms[]" value="wechat_ai" title="微信AI搜索" checked>
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">词变体（可选）</label>
						<div class="layui-input-block">
							<input type="text" name="variants" class="layui-input" placeholder="如：别名、缩写，用逗号分隔" />
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-input-block">
							<button class="layui-btn" lay-submit lay-filter="form">保存</button>
							<a class="layui-btn layui-btn-primary" href="?keyword-index">返回</a>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	layui.use(['form','layer', 'miniTab'], function () {
		var layer = layui.layer, form = layui.form, miniTab = layui.miniTab;

		//监听提交
		form.on('submit(form)', function () {
			adminAjax.postform('#form',function (data) {
				var json = toJson(data);
				if( json.err == 0 ){
					var icon = 1;
				}else{
					var icon = 5;
				}
				layer.msg(json.msg, {icon: icon});
				if(json.err==0) {
					setTimeout(function(){
						miniTab.reloadIframe('index.php?keyword-index');
						miniTab.deleteCurrentByIframe();
					}, 1500);
				}
			});
			return false;
		});
	});
</script>
</body>
</html>
