{inc:header.htm}
<div class="layuimini-container">
	<div class="layuimini-main">
		<div class="layui-card">
			<div class="layui-card-header">批量注册用户</div>
			<div class="layui-card-body">
				<form id="form" class="layui-form" action="?tool-le_batch_reg_user-ajax-1" method="post">
					<input type="hidden" name="FORM_HASH" value="{@form_hash()}" />
					<div class="layui-form-item">
						<label class="layui-form-label required">用户组</label>
						<div class="layui-input-inline">
							{$input['groupidhtml']}
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label required">密码</label>
						<div class="layui-input-inline">
							{$input['password']}
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label required">用户名</label>
						<div class="layui-input-inline">
							<textarea name="users" placeholder="请输入用户名，一行一个" class="layui-textarea" autocomplete="off"></textarea>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-input-block">
							<button class="layui-btn" lay-submit lay-filter="form"><i class="layui-icon">&#xe654;</i> 开始注册</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	layui.use('form', function(){
		var form = layui.form;

		//监听提交
		form.on('submit(form)', function(){
			adminAjax.submit("#form");
		});
	});
</script>
</body>
</html>
