{inc:header.htm}
<style>
/* 弹窗模式紧凑布局：缩小区块标题与表单项间距，双列排布 */
.se-form .layui-elem-field { margin: 10px 8px 0; padding: 0 8px; border-width: 0; border-left: 3px solid #1E9FFF; }
.se-form .layui-form-item { margin-bottom: 6px; clear: both; }
.se-form .layui-form-label { width: 90px; padding: 7px 10px 7px 0; }
.se-form .layui-input-inline { width: calc(100% - 100px); }
.se-form .layui-input-block { margin-left: 100px; }
.se-form .layui-form-mid { padding: 7px 0 !important; line-height: 1.4; font-size: 12px; width: auto; }
.se-two-col { display: flex; gap: 0 12px; }
.se-two-col > .layui-form-item { flex: 1; min-width: 0; }
/* 品牌图片预览 */
.brand-url-row { display: flex; gap: 8px; align-items: center; }
.brand-url-row .layui-input { flex: 1; }
.brand-thumb { width: 40px; height: 40px; object-fit: contain; border: 1px dashed #e2e2e2; border-radius: 4px; flex-shrink: 0; background: #fafafa; }
.brand-thumb[hidden] { display: none; }
/* CSS 变量行 */
.tv-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.tv-row .tv-key { width: 32%; }
.tv-row .tv-eq { color: #999; flex-shrink: 0; }
.tv-row .tv-val { width: 32%; flex: 1; }
.tv-row .tv-color-preview { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #e2e2e2; flex-shrink: 0; cursor: pointer; }
.tv-del { flex-shrink: 0; }
/* SEO 字数统计 */
.seo-count { display: block; font-size: 12px; color: #999; margin-top: 2px; line-height: 18px; }
.seo-count.over { color: #ff5722; }
.seo-count.near { color: #ffb800; }
</style>
<div class="layuimini-container">
	<div class="layuimini-main">
		<div class="layui-card">
			<div class="layui-card-header">编辑站点</div>
			<div class="layui-card-body se-form">
				<form id="form" class="layui-form" action="?site-edit-ajax-1" method="post">
					<input type="hidden" name="FORM_HASH" value="{@form_hash()}" />
					<input name="sid" type="hidden" value="{$site['sid']}" />
					<fieldset class="layui-elem-field layui-field-title"><legend>基本信息</legend></fieldset>
					<div class="se-two-col">
						<div class="layui-form-item">
							<label class="layui-form-label required">站点名称</label>
							<div class="layui-input-inline">
								<input type="text" name="site_name" value="{$site['site_name']}" autocomplete="off" placeholder="请输入站点名称" class="layui-input" lay-verify="required" lay-reqtext="站点名称不能为空" />
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">主题</label>
							<div class="layui-input-inline">
								<select name="theme" lay-filter="theme-select">
									{loop:$themes $t}
									<option value="{$t}" {if:$t==$site['theme']}selected{/if}>{$t}</option>
									{/loop}
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label required">域名</label>
						<div class="layui-input-inline">
							<input type="text" name="domain" value="{$site['domain']}" autocomplete="off" placeholder="请输入域名，如 example.com；泛解析 *.example.com" class="layui-input" lay-verify="required" lay-reqtext="域名不能为空" />
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">排序值</label>
						<div class="layui-input-inline">
							<input type="text" name="sort_order" value="{$sort_order}" autocomplete="off" placeholder="数值越大越靠前" class="layui-input" />
						</div>
					</div>

					<fieldset class="layui-elem-field layui-field-title"><legend>SEO 设置</legend></fieldset>
					<div class="se-two-col">
						<div class="layui-form-item">
							<label class="layui-form-label">SEO 标题</label>
							<div class="layui-input-block" style="margin-left: 100px;">
								<input type="text" name="seo_title" id="seo_title" value="{$seo['seo_title']}" autocomplete="off" placeholder="站点级 SEO 标题，留空跟随全局" class="layui-input" />
								<span class="seo-count" data-limit="60" data-target="seo_title"></span>
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">SEO 关键词</label>
							<div class="layui-input-block" style="margin-left: 100px;">
								<input type="text" name="seo_keywords" id="seo_keywords" value="{$seo['seo_keywords']}" autocomplete="off" placeholder="多个关键词用逗号分隔，留空跟随全局" class="layui-input" />
								<span class="seo-count" data-limit="200" data-target="seo_keywords"></span>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">SEO 描述</label>
						<div class="layui-input-block" style="margin-left: 100px;">
							<textarea name="seo_description" id="seo_description" autocomplete="off" placeholder="站点级 SEO 描述，留空跟随全局" class="layui-textarea" style="min-height: 60px;">{$seo['seo_description']}</textarea>
							<span class="seo-count" data-limit="160" data-target="seo_description"></span>
						</div>
					</div>

					<fieldset class="layui-elem-field layui-field-title"><legend>维护设置</legend></fieldset>
					<div class="layui-form-item">
						<label class="layui-form-label">维护提示语</label>
						<div class="layui-input-block" style="margin-left: 100px;">
							<textarea name="maintenance_message" autocomplete="off" placeholder="站点被禁用（维护）时前台展示的提示语，留空使用默认文案" class="layui-textarea" style="min-height: 60px;">{$seo['maintenance_message']}</textarea>
						</div>
					</div>

					<fieldset class="layui-elem-field layui-field-title"><legend>品牌设置</legend></fieldset>
					<div class="se-two-col">
						<div class="layui-form-item">
							<label class="layui-form-label">Logo 地址</label>
							<div class="layui-input-block" style="margin-left: 100px;">
								<div class="brand-url-row">
									<input type="text" name="logo_url" id="logo_url" value="{$config['logo_url']}" autocomplete="off" placeholder="https://example.com/logo.png" class="layui-input" />
									<button type="button" class="layui-btn layui-btn-sm layui-btn-primary brand-upload" data-target="logo_url" data-preview="logo_preview"><i class="layui-icon">&#xe681;</i> 上传</button>
									<img class="brand-thumb" id="logo_preview" alt="" hidden />
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">Favicon</label>
							<div class="layui-input-block" style="margin-left: 100px;">
								<div class="brand-url-row">
									<input type="text" name="favicon_url" id="favicon_url" value="{$config['favicon_url']}" autocomplete="off" placeholder="站点图标地址" class="layui-input" />
									<button type="button" class="layui-btn layui-btn-sm layui-btn-primary brand-upload" data-target="favicon_url" data-preview="favicon_preview"><i class="layui-icon">&#xe681;</i> 上传</button>
									<img class="brand-thumb" id="favicon_preview" alt="" hidden />
								</div>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">水印地址</label>
						<div class="layui-input-block" style="margin-left: 100px;">
							<div class="brand-url-row">
								<input type="text" name="watermark_url" id="watermark_url" value="{$config['watermark_url']}" autocomplete="off" placeholder="图片水印地址，留空表示不设置" class="layui-input" />
								<button type="button" class="layui-btn layui-btn-sm layui-btn-primary brand-upload" data-target="watermark_url" data-preview="watermark_preview"><i class="layui-icon">&#xe681;</i> 上传</button>
								<img class="brand-thumb" id="watermark_preview" alt="" hidden />
							</div>
						</div>
					</div>

					<fieldset class="layui-elem-field layui-field-title"><legend>主题高级设置</legend></fieldset>
					<div class="layui-form-item">
						<label class="layui-form-label">手机主题</label>
						<div class="layui-input-block" style="margin-left: 100px;">
							<select name="mobile_theme" lay-search>
								<option value="none" {if:$mobile_theme=='none'}selected{/if}>不设置（跟随全局）</option>
								{loop:$themes $t}
								<option value="{$t}" {if:$t==$mobile_theme}selected{/if}>{$t}</option>
								{/loop}
							</select>
							<div class="layui-form-mid layui-word-aux">手机访问该站点时使用的主题；「不设置」则跟随全局手机模板配置（如已开启移动端模板）。</div>
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">启用主题</label>
						<div class="layui-input-block" style="margin-left: 100px;">
							{loop:$themes $t}
							<input type="checkbox" name="enabled_themes[]" value="{$t}" title="{$t}" lay-skin="primary" {$enabled_map[$t]} />
							{/loop}
							<div class="layui-form-mid layui-word-aux">不勾选任何主题表示不限制；仅勾选部分主题时，站点只能应用勾选范围内的主题。</div>
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">CSS 变量</label>
						<div class="layui-input-block" style="margin-left: 100px;">
							<div id="theme-vars-box">
								{loop:$theme_vars $tv}
								<div class="tv-row">
									<input type="text" name="theme_var_keys[]" value="{$tv['k']}" autocomplete="off" placeholder="变量名，如 --primary-color" class="layui-input tv-key" />
									<span class="tv-eq">=</span>
									<input type="text" name="theme_var_values[]" value="{$tv['v']}" autocomplete="off" placeholder="变量值，如 #1e9fff" class="layui-input tv-val" />
									<span class="tv-color-preview" title="点击预览颜色"></span>
									<a href="javascript:;" class="layui-btn layui-btn-sm layui-btn-danger tv-del"><i class="layui-icon">&#xe640;</i></a>
								</div>
								{/loop}
							</div>
							<button type="button" id="add-var" class="layui-btn layui-btn-sm layui-btn-primary"><i class="layui-icon">&#xe654;</i> 添加变量</button>
							<div class="layui-form-mid layui-word-aux">站点级 CSS 变量覆写，可覆盖主题预设的 :root 变量（颜色、字号等）。</div>
						</div>
					</div>

					<div class="layui-form-item" style="margin-top: 12px;">
						<div class="layui-input-block">
							<button class="layui-btn" lay-submit lay-filter="form"><i class="layui-icon">&#xe605;</i> 保存修改</button>
							<a class="layui-btn layui-btn-primary" id="btn-back" href="javascript:;">返回</a>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
<script type="text/javascript">
layui.use(['form', 'layer', 'miniTab', 'jquery', 'upload'], function(){
	var layer = layui.layer, form = layui.form, miniTab = layui.miniTab, upload = layui.upload;

	form.render();

	// SEO 字数统计：near=接近上限（>=80%），over=超限标红
	function refreshSeoCount($span) {
		var len = $('#' + $span.attr('data-target')).val().length;
		var limit = parseInt($span.attr('data-limit'), 10);
		$span.text(len + ' / ' + limit + ' 字符');
		$span.toggleClass('over', len > limit);
		$span.toggleClass('near', len > limit * 0.8 && len <= limit);
	}
	$('.seo-count').each(function () {
		var $span = $(this);
		refreshSeoCount($span);
		$(document).on('input change', '#' + $span.attr('data-target'), function () {
			refreshSeoCount($span);
		});
	});

	// 品牌图片上传：data-target 为 URL 输入框 id，data-preview 为预览 img id
	upload.render({
		elem: '.brand-upload',
		url: 'index.php?attach-upload_pic-table-site_manager',
		field: 'upfile',
		accept: 'images',
		acceptMime: 'image/*',
		multiple: false,
		bindAction: false,
		done: function (res) {
			if (res.err == 1) {
				layer.msg(res.msg, {icon: 5});
				return;
			}
			var target = $(this.elem).attr('data-target');
			var preview = $(this.elem).attr('data-preview');
			var src = (res.data && res.data.src) ? res.data.src : '';
			$('#' + target).val(src);
			updateBrandPreview(target, preview, src);
			layer.msg('上传成功', {icon: 1});
		},
		error: function () {
			layer.msg('上传失败', {icon: 5});
		}
	});

	// 回显品牌预览图
	function updateBrandPreview(target, preview, src) {
		var img = $('#' + preview);
		if (src) {
			img.attr('src', src).removeAttr('hidden');
		} else {
			img.attr('src', '').attr('hidden', 'hidden');
		}
	}
	updateBrandPreview('logo_url', 'logo_preview', '{$config['logo_url']}');
	updateBrandPreview('favicon_url', 'favicon_preview', '{$config['favicon_url']}');
	updateBrandPreview('watermark_url', 'watermark_preview', '{$config['watermark_url']}');

	// CSS 变量行：颜色预览块
	function isColorLike(v) {
		return /^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})|rgb|rgba|hsl|hsla)/.test(v);
	}
	function refreshTvPreview($row) {
		var val = $row.find('.tv-val').val().trim();
		var $p = $row.find('.tv-color-preview');
		if (isColorLike(val)) {
			$p.css('background', val).attr('title', val);
		} else {
			$p.css('background', '').attr('title', '点击预览颜色');
		}
	}
	// 绑定现有行
	$('#theme-vars-box .tv-row').each(function () { refreshTvPreview($(this)); });
	// 监听值变化刷新预览
	$(document).on('input', '.tv-row .tv-val', function () {
		refreshTvPreview($(this).closest('.tv-row'));
	});

	// 添加 CSS 变量行
	$('#add-var').on('click', function () {
		var row = '<div class="tv-row">'
			+ '<input type="text" name="theme_var_keys[]" value="" autocomplete="off" placeholder="变量名，如 --primary-color" class="layui-input tv-key" />'
			+ '<span class="tv-eq">=</span>'
			+ '<input type="text" name="theme_var_values[]" value="" autocomplete="off" placeholder="变量值，如 #1e9fff" class="layui-input tv-val" />'
			+ '<span class="tv-color-preview" title="点击预览颜色"></span>'
			+ '<a href="javascript:;" class="layui-btn layui-btn-sm layui-btn-danger tv-del"><i class="layui-icon">&#xe640;</i></a>'
			+ '</div>';
		$('#theme-vars-box').append(row);
	});
	// 删除 CSS 变量行（事件委托，动态行同样生效）
	$(document).on('click', '.tv-del', function () {
		$(this).closest('.tv-row').remove();
	});

	// 返回列表：激活后台的站点管理标签页；不在主框架内时回退为跳转
	$('#btn-back').on('click', function () {
		if (parent !== window && parent.layui && parent.layui.element) {
			miniTab.openNewTabByIframe({ href: 'index.php?site-index', title: '站点管理' });
			miniTab.deleteCurrentByIframe();
		} else {
			window.location.href = 'index.php?site-index';
		}
	});

	//监听提交
	form.on('submit(form)', function () {
		adminAjax.postform('#form', function (data) {
			var json = toJson(data);
			layer.msg(json.msg, { icon: json.err == 0 ? 1 : 5 });
			if (json.err == 0) {
				setTimeout(function () {
					// 标签页模式（与文章管理一致）：刷新列表页 iframe 并关闭当前标签
					miniTab.reloadIframe('index.php?site-index');
					miniTab.deleteCurrentByIframe();
				}, 1200);
			}
		});
		return false;
	});
});
</script>
</body>
</html>
