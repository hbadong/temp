{inc:header.htm}
<style>
/* 站点设置页专用样式 */
.settings-wrap { padding: 0 16px; }
.settings-card { margin-bottom: 16px; }
.settings-card .layui-card-header { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
.settings-card .layui-card-header i { color: #1E9FFF; margin-right: 8px; }
.settings-card .layui-card-header .header-tip { font-weight: 400; font-size: 12px; color: #999; }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
.settings-grid .layui-form-item { display: flex; align-items: center; }
.settings-grid .layui-form-label { width: 110px; padding: 9px 12px 9px 0; text-align: right; }
.settings-grid .layui-input-inline { width: auto; flex: 1; }
.settings-grid .layui-input-block { margin-left: 110px; }
.settings-actions { position: sticky; bottom: 0; padding: 12px 0; background: #fff; border-top: 1px solid #eee; text-align: right; margin-top: 16px; box-shadow: 0 -2px 6px rgba(0,0,0,.03); z-index: 10; }
.settings-actions .layui-btn + .layui-btn { margin-left: 8px; }
.field-hint { display: block; color: #999; font-size: 12px; margin-top: 4px; }
.stat-cards { display: flex; gap: 12px; margin: 0 0 16px; flex-wrap: wrap; }
.stat-card { flex: 1; min-width: 110px; background: #fff; border: 1px solid #eee; border-radius: 4px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.03); cursor: pointer; transition: all .2s; }
.stat-card:hover { border-color: #1E9FFF; box-shadow: 0 2px 8px rgba(30,159,255,.12); }
.stat-card.active { border-color: #1E9FFF; box-shadow: 0 0 0 2px rgba(30,159,255,.15); }
.stat-card span { color: #999; font-size: 12px; }
.stat-card b { font-size: 26px; font-weight: 700; line-height: 1; }
.sc-total { color: #1E9FFF; }
.sc-enable { color: #16b777; }
.sc-disable { color: #ffb800; }
.sc-deleted { color: #ff5722; }
@media (max-width: 600px) { .stat-card { min-width: 45%; } }
@media (max-width: 900px) { .settings-grid { grid-template-columns: 1fr; } }

@media (max-width: 600px) {
  .settings-grid .layui-form-item { flex-direction: column; align-items: stretch; }
  .settings-grid .layui-form-label { width: auto; float: none; display: block; text-align: left; padding: 0 0 6px; line-height: 20px; }
  .settings-grid .layui-input-inline { width: 100%; flex: none; }
  .settings-grid .layui-input-block { margin-left: 0; }
}
.theme-cell { display: inline-flex; align-items: center; gap: 6px; }
.theme-thumb { width: 28px; height: 20px; object-fit: cover; border-radius: 3px; border: 1px solid #eee; }
.theme-name { color: #666; font-size: 12px; }
</style>
<div class="layuimini-container">
	<div class="layuimini-main">
		<div class="layui-tab layui-tab-brief" lay-filter="main">
			<ul class="layui-tab-title">
				<li class="layui-this">功能</li>
				<li>插件设置</li>
			</ul>
			<input type="hidden" id="active-tab" value="{$active_tab}" />
			<div class="layui-tab-content">

				<!-- Tab 1：站点列表（原页面内容） -->
				<div class="layui-tab-item layui-show">
					<!-- 概览统计卡片（点击可筛选对应状态） -->
					<div class="stat-cards">
						<div class="stat-card" data-status=""><span>站点总数</span><b class="sc-total">{$stats['total']}</b></div>
						<div class="stat-card" data-status="1"><span>启用中</span><b class="sc-enable">{$stats['enabled']}</b></div>
						<div class="stat-card" data-status="0"><span>已禁用</span><b class="sc-disable">{$stats['disabled']}</b></div>
						<div class="stat-card" data-status="-1"><span>已删除</span><b class="sc-deleted">{$stats['deleted']}</b></div>
					</div>
					<fieldset class="table-search-fieldset">
						<legend>站点列表</legend>
						<div>
							<form class="layui-form layui-form-pane" lay-filter="site-search-form">
								<div class="layui-form-item">
									<div class="layui-inline">
										<label class="layui-form-label">站点名称</label>
										<div class="layui-input-inline">
											<input placeholder="请输入站点名称或域名" autocomplete="off" type="text" class="layui-input" name="keyword" />
										</div>
									</div>
									<div class="layui-inline">
										<label class="layui-form-label">状态</label>
										<div class="layui-input-inline">
											<select name="status">
												<option value="">全部</option>
												<option value="1">启用</option>
												<option value="0">禁用</option>
												<option value="-1">删除</option>
											</select>
										</div>
									</div>
									<div class="layui-inline">
										<button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="site-search-btn"><i class="layui-icon">&#xe615;</i> 搜索</button>
									</div>
								</div>
							</form>
						</div>
					</fieldset>
					<table class="layui-hide" id="data-table" lay-filter="data-table-filter"></table>

					<script type="text/html" id="toolbar">
						<div class="layui-btn-container">
							<button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="add"><i class="layui-icon">&#xe608;</i> 添加站点</button>
							<button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="batch_enable"><i class="layui-icon">&#xe612;</i> 批量启用</button>
							<button class="layui-btn layui-btn-sm layui-btn-warm" lay-event="batch_disable"><i class="layui-icon">&#xe60c;</i> 批量禁用</button>
							<button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="batch_delete"><i class="layui-icon">&#xe640;</i> 批量删除</button>
							<button class="layui-btn layui-btn-sm layui-btn-warm" id="btn-sync"><i class="layui-icon">&#xe669;</i> 一键同步</button>
							<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="export"><i class="layui-icon">&#xe601;</i> 导出</button>
							<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="import"><i class="layui-icon">&#xe61c;</i> 导入</button>
						</div>
					</script>
				</div>

				<!-- Tab 2：插件设置 -->
				<div class="layui-tab-item">
					<div class="settings-wrap">
						<!-- 基础设置 -->
						<div class="layui-card settings-card">
							<div class="layui-card-header">
								<span><i class="layui-icon">&#xe620;</i> 基础设置</span>
								<span class="header-tip">新建站点时的默认值</span>
							</div>
							<div class="layui-card-body">
								<form id="form-settings" class="layui-form" action="?site-settings_post-ajax-1" method="post">
									<input type="hidden" name="FORM_HASH" value="{@form_hash()}" />
									<div class="settings-grid">
										<div class="layui-form-item">
											<label class="layui-form-label">默认主题</label>
											<div class="layui-input-inline">
												<select name="default_theme" lay-search>
													{loop:$themes $t}
													<option value="{$t}" {if:$t==$settings['default_theme']}selected{/if}>{$t}</option>
													{/loop}
												</select>
												<span class="field-hint">新建站点未指定主题时使用此值</span>
											</div>
										</div>
										<div class="layui-form-item">
											<label class="layui-form-label">默认站点名称</label>
											<div class="layui-input-inline">
												<input type="text" name="default_site_name" class="layui-input" value="{$settings['default_site_name']}" placeholder="例如：默认站点">
												<span class="field-hint">后台创建站点时的占位名</span>
											</div>
										</div>
										<div class="layui-form-item">
											<label class="layui-form-label">默认状态</label>
											<div class="layui-input-inline">
												<input type="radio" name="default_status" value="1" title="启用" {if:$settings['default_status']}checked{/if}>
												<input type="radio" name="default_status" value="0" title="禁用" {if:!$settings['default_status']}checked{/if}>
												<span class="field-hint">新建站点默认是否启用</span>
											</div>
										</div>
									</div>
								</form>
							</div>
						</div>

						<!-- 域名路由 -->
						<div class="layui-card settings-card">
							<div class="layui-card-header">
								<span><i class="layui-icon">&#xe9aa;</i> 域名路由</span>
								<span class="header-tip">控制请求如何匹配到具体站点</span>
							</div>
							<div class="layui-card-body">
								<div class="settings-grid">
									<div class="layui-form-item">
										<label class="layui-form-label">泛域名解析</label>
										<div class="layui-input-inline">
											<input type="radio" name="wildcard_domain" value="1" title="启用" {if:$settings['wildcard_domain']}checked{/if} form="form-settings">
											<input type="radio" name="wildcard_domain" value="0" title="禁用" {if:!$settings['wildcard_domain']}checked{/if} form="form-settings">
											<span class="field-hint">支持 *.domain.com 格式自动路由</span>
										</div>
									</div>
									<div class="layui-form-item">
										<label class="layui-form-label">域名匹配方式</label>
										<div class="layui-input-inline">
											<input type="radio" name="domain_match" value="wildcard" title="通配符" {if:$settings['domain_match']=='wildcard'}checked{/if} form="form-settings">
											<input type="radio" name="domain_match" value="exact" title="精确匹配" {if:$settings['domain_match']=='exact'}checked{/if} form="form-settings">
											<span class="field-hint">通配符更宽松，精确更严格</span>
										</div>
									</div>
								</div>
							</div>
						</div>

						<!-- 底部操作栏 -->
						<div class="settings-actions">
							<a class="layui-btn layui-btn-primary" href="?site-index">返回列表</a>
							<button type="submit" lay-submit lay-filter="form-settings" class="layui-btn">
								<i class="layui-icon">&#xe605;</i> 保存设置
							</button>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	layui.use(['form', 'layer', 'table', 'element', 'miniTab'], function () {
		var layer = layui.layer, form = layui.form, table = layui.table, element = layui.element, miniTab = layui.miniTab;

		// 兼容旧设置页入口：?site-index-tab-settings 时激活第二个 tab
		if (document.getElementById('active-tab') && document.getElementById('active-tab').value === 'settings') {
			element.tabChange('main', '1');
		}

		// 概览卡片点击筛选：data-status 为空=全部，否则按状态筛选
		var statCards = document.querySelectorAll('.stat-card[data-status]');
		function highlightStat(status) {
			statCards.forEach(function (card) {
				card.classList.toggle('active', String(card.getAttribute('data-status')) === String(status));
			});
		}
		statCards.forEach(function (card) {
			card.addEventListener('click', function () {
				var st = card.getAttribute('data-status');
				table.reload('data-table', {
					where: { status: st },
					page: {curr: 1}
				});
				highlightStat(st);
				// 同步搜索表单下拉
				var sel = document.querySelector('form[lay-filter="site-search-form"] select[name="status"]');
				if (sel) { sel.value = st; form.render('select'); }
			});
		});

		table.render({
			elem: '#data-table',
			url: 'index.php?site-json_list',
			method: 'post',
			where: {status: ''},
			height: 'full-175',
			toolbar: '#toolbar',
			defaultToolbar: ['filter', 'exports', 'print'],
			cellMinWidth: 50,
			cols: [[
				{type: 'checkbox', width: 45, align: 'center'},
				{field: 'sid', title: 'ID', width: 70, sort: true, align: 'center'},
				{field: 'site_name', title: '站点名称', minwidth: 140},
				{title: '域名', minwidth: 170, templet: '#domain-tpl'},
				{title: '主题', width: 130, align: 'center', templet: '#theme-tpl'},
				{field: 'sort_order', title: '排序', width: 80, align: 'center', edit: 'text'},
				{title: '状态', width: 90, templet: '#status-tpl', align: 'center'},
				{field: 'created_at', title: '创建时间', width: 170, align: 'center'},
				{title: '操作', width: 190, toolbar: '#toolbar-tpl', align: 'center'}
			]],
			limits: [10, 15, 20, 50],
			limit: 15,
			page: true
		});

		// 打开站点创建/编辑页（独立标签页，与文章管理一致）
		// miniTab 依赖后台主框架的 .layuimini-tab 容器；列表页不在主框架 iframe 内时
		// （如独立打开）自动回退为当前窗口跳转，避免点击无反应
		function openForm(sid, title) {
			var href = 'index.php?site-' + (sid ? 'edit-sid-' + sid : 'create');
			if (parent !== window && parent.layui && parent.layui.element) {
				miniTab.openNewTabByIframe({ href: href, title: title });
			} else {
				window.location.href = href;
			}
		}

		form.on('submit(site-search-btn)', function (data) {
			// 服务端搜索/筛选：携带 keyword 与 status 重新拉取分页数据
			table.reload('data-table', {
				where: {
					keyword: data.field.keyword,
					status: data.field.status || ''
				},
				page: {curr: 1}
			});
			highlightStat(data.field.status || '');
			return false;
		});

		table.on('toolbar(data-table-filter)', function (obj) {
			if (obj.event === 'add') {
				openForm(0, '添加站点');
			} else if (obj.event === 'batch_delete') {
				var checkStatus = table.checkStatus('data-table');
				var data = checkStatus.data;
				if (data.length === 0) {
					layer.msg('请选择要删除的站点', { icon: 5 });
					return false;
				}
				layer.confirm('确定删除选中的 ' + data.length + ' 个站点吗？', function () {
					var id_arr = data.map(function (item) { return item.sid; });
					adminAjax.postd("index.php?site-batch_delete-ajax-1", { id_arr: id_arr });
				});
			} else if (obj.event === 'batch_enable' || obj.event === 'batch_disable') {
				var enable = obj.event === 'batch_enable';
				var checkStatus = table.checkStatus('data-table');
				var data = checkStatus.data;
				if (data.length === 0) {
					layer.msg('请先勾选要' + (enable ? '启用' : '禁用') + '的站点', { icon: 5 });
					return false;
				}
				layer.confirm('确定' + (enable ? '启用' : '禁用') + '选中的 ' + data.length + ' 个站点吗？', function () {
					var id_arr = data.map(function (item) { return item.sid; });
					adminAjax.postd("index.php?site-batch_toggle-ajax-1", {
						id_arr: id_arr,
						action: enable ? 'enable' : 'disable',
						FORM_HASH: '{@form_hash()}'
					}, function (json) {
						var res = toJson(json);
						layer.msg(res.msg || (res.err ? '操作失败' : '操作成功'), {icon: res.err ? 5 : 1});
						if (!res.err) table.reload('data-table');
					});
				});
			} else if (obj.event === 'export') {
				window.location.href = 'index.php?site-export';
			} else if (obj.event === 'import') {
				layer.open({
					type: 1,
					title: '导入站点配置（JSON）',
					area: ['560px', '420px'],
					content: $('#import-tpl').html(),
					btn: ['导入', '取消'],
					btn1: function (index) {
						var txt = $('#import-json-textarea').val();
						if (!txt || !txt.trim()) {
							layer.msg('请粘贴导出的 JSON 内容', {icon: 5});
							return;
						}
						adminAjax.postd("index.php?site-import_post-ajax-1", {import_json: txt}, function (json) {
							var res = toJson(json);
							layer.msg(res.msg || (res.err ? '导入失败' : '导入成功'), {icon: res.err ? 5 : 1});
							if (!res.err) {
								layer.close(index);
								table.reload('data-table');
							}
						});
					}
				});
			}
		});

		// 一键同步（REQ-01-AC8）：sync 校验 form_submit()，必须 POST + FORM_HASH
		document.getElementById('btn-sync').addEventListener('click', function () {
			layer.confirm('确定同步全部站点？', {icon: 3, title: '确认'}, function(){
				adminAjax.postd("index.php?site-sync-ajax-1", {FORM_HASH: '{@form_hash()}'});
			});
		});

		// 行内编辑排序值：field=sort_order 时提交 set_sort，失败回滚重载
		table.on('edit(data-table-filter)', function (obj) {
			if (obj.field !== 'sort_order') return;
			var sid = obj.data.sid;
			var val = parseInt(obj.value, 10);
			if (isNaN(val)) {
				layer.msg('排序值必须为数字', {icon: 5});
				table.reload('data-table');
				return;
			}
			adminAjax.postd("index.php?site-set_sort-ajax-1", {sid: sid, sort_order: val}, function (json) {
				var res = toJson(json);
				if (res.err) {
					layer.msg(res.msg, {icon: 5});
				} else {
					layer.msg(res.msg, {icon: 1, time: 800});
				}
				table.reload('data-table');
			});
		});

		table.on('tool(data-table-filter)', function (obj) {
			var data = obj.data;
			if (obj.event === 'edit') {
				openForm(data.sid, '编辑站点');
			} else if (obj.event === 'view') {
				window.open('http://' + data.domain + '/', '_blank');
			} else if (obj.event === 'toggle') {
				adminAjax.postd("index.php?site-toggle-ajax-1", {sid: data.sid, FORM_HASH: '{@form_hash()}'});
			} else if (obj.event === 'restore') {
				layer.confirm('确定恢复该站点？', function () {
					adminAjax.postd("index.php?site-restore-ajax-1", {sid: data.sid, FORM_HASH: '{@form_hash()}'});
				});
			} else if (obj.event === 'delete') {
				layer.confirm('确定删除该站点？', function () {
					adminAjax.postd("index.php?site-delete-ajax-1", {sid: data.sid, FORM_HASH: '{@form_hash()}'});
				});
			} else if (obj.event === 'copy') {
				layer.open({
					type: 1,
					title: '复制站点',
					area: ['480px', 'auto'],
					content: $('#copy-tpl').html(),
					btn: ['复制', '取消'],
					btn1: function (index) {
						var name = $('#copy-site-name').val().trim();
						var domain = $('#copy-domain').val().trim();
						if (!name) { layer.msg('站点名称不能为空', {icon: 5}); return; }
						if (!domain) { layer.msg('域名不能为空', {icon: 5}); return; }
						adminAjax.postd("index.php?site-copy-ajax-1", {
							sid: data.sid,
							site_name: name,
							domain: domain,
							FORM_HASH: '{@form_hash()}'
						}, function (json) {
							var res = toJson(json);
							if (res.err) {
								layer.msg(res.msg || '复制失败', {icon: 5});
							} else {
								layer.close(index);
								layer.msg(res.msg || res.message || '站点已复制', {icon: 1});
								table.reload('data-table');
							}
						});
					}
				});
				$('#copy-site-name').val(data.site_name + '副本');
			}
		});

		// 插件设置表单提交
		form.render();
		form.on('submit(form-settings)', function () {
			adminAjax.postform('#form-settings', function (data) {
				var json = toJson(data);
				layer.msg(json.msg, { icon: json.err == 0 ? 1 : 5 });
			});
			return false;
		});
	});
</script>

<script type="text/html" id="import-tpl">
	<div style="padding: 16px;">
		<div style="color:#999; font-size:12px; margin-bottom:8px;">粘贴「导出」生成的 JSON 内容；按域名匹配：已存在则更新配置（软删除记录将被恢复），不存在则新建。</div>
		<textarea id="import-json-textarea" class="layui-textarea" style="height: 220px;" placeholder='{"export_time":"...","sites":[{"site_name":"...","domain":"example.com","theme":"default","sort_order":0,"status":1,"config":{}}]}'></textarea>
	</div>
</script>

<script type="text/html" id="copy-tpl">
	<div style="padding: 16px 16px 4px;">
		<div style="color:#999; font-size:12px; margin-bottom:12px;">主题、品牌图片、SEO 与 CSS 变量等配置将一并复制自源站点。</div>
		<div class="layui-form-item">
			<label class="layui-form-label" style="width:80px;">站点名称</label>
			<div class="layui-input-inline" style="width: 340px;">
				<input type="text" id="copy-site-name" class="layui-input" placeholder="例如：新站点副本">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label" style="width:80px;">域名</label>
			<div class="layui-input-inline" style="width: 340px;">
				<input type="text" id="copy-domain" class="layui-input" placeholder="例如：copy.example.com">
			</div>
		</div>
		<div style="color:#bbb; font-size:12px; margin: 0 0 8px 96px;">仅允许字母、数字、点、连字符；通配符 * 仅能作为 *. 前缀</div>
	</div>
</script>

<script type="text/html" id="domain-tpl">
	{{# if (d.status == 1) { }}
	<a href="http://{{d.domain}}/" target="_blank" rel="noopener" style="color:#1E9FFF;">{{d.domain}} <i class="layui-icon" style="font-size:12px;">&#xe64a;</i></a>
	{{# } else { }}
	<span style="color:#bbb;">{{d.domain}}</span>
	{{# } }}
</script>

<script type="text/html" id="theme-tpl">
	<div class="theme-cell">
		{{# if (d.theme_pic) { }}
		<img src="{{d.theme_pic}}" onerror="this.style.display='none'" class="theme-thumb" />
		{{# } }}
		<span class="theme-name">{{d.theme || 'default'}}</span>
	</div>
</script>

<script type="text/html" id="status-tpl">
	{{# if (d.status == 1) { }}
		<span class="layui-badge layui-bg-green">启用</span>
	{{# } else if (d.status == 0) { }}
		<span class="layui-badge layui-bg-gray">禁用</span>
	{{# } else { }}
		<span class="layui-badge layui-bg-red">删除</span>
	{{# } }}
</script>

<script type="text/html" id="toolbar-tpl">
	<div class="layui-btn-group">
		{{# if (d.status == 1) { }}
		<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="view" title="前台预览"><i class="layui-icon">&#xe64a;</i> 预览</a>
		{{# } }}
		<a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
		<a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="copy">复制</a>
		{{# if (d.status == 1) { }}
		<a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="toggle">禁用</a>
		{{# } else if (d.status == 0) { }}
		<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="toggle">启用</a>
		{{# } else if (d.status == -1) { }}
		<a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="restore" title="恢复已删除站点"><i class="layui-icon">&#xe65c;</i> 恢复</a>
		{{# } }}
		{{# if (d.status != -1) { }}
		<a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a>
		{{# } }}
	</div>
</script>
</body>
</html>
