{inc:header.htm}
<div class="layuimini-container">
	<div class="layuimini-main">
		<div class="layui-card">
			<div class="layui-card-header">友情链接</div>
			<div class="layui-card-body">
				<form id="form" class="layui-form" action="?links-{$_GET['action']}-ajax-1" method="post">
					<input type="hidden" name="FORM_HASH" value="{@form_hash()}" />
					<input name="id" type="hidden" value="{$data['id']}" />
					<div class="layui-form-item">
						<label class="layui-form-label required">链接名称</label>
						<div class="layui-input-inline">
							<input type="text" name="title" value="{$data['name']}" autocomplete="off" placeholder="链接名称" class="layui-input" lay-verify="required" lay-reqtext="链接名称不能为空" />
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label required">链接</label>
						<div class="layui-input-block">
							<input type="text" name="url" value="{$data['url']}" autocomplete="off" placeholder="链接" class="layui-input" lay-verify="required" lay-reqtext="链接不能为空" />
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">排序值</label>
						<div class="layui-input-inline">
							<input type="number" name="orderby" value="{$data['orderby']}" autocomplete="off" placeholder="排序值" class="layui-input" />
						</div>
					</div>

					<div class="layui-form-item">
						<div class="layui-input-block">
							<button class="layui-btn" lay-submit lay-filter="form">提交</button>
							<a class="layui-btn layui-btn-primary" href="?links-index">返回</a>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	layui.use(['form','layer', 'miniTab'], function () {
		var layer = layui.layer, form = layui.form, miniTab = layui.miniTab;

		//监听提交
		form.on('submit(form)', function () {
			adminAjax.postform('#form',function (data) {
				var json = toJson(data);
				if( json.err == 0 ){
					var icon = 1;
				}else{
					var icon = 5;
				}
				layer.msg(json.msg, {icon: icon});
				if(json.err==0) {
					setTimeout(function(){
						miniTab.reloadIframe('index.php?links-index');
						miniTab.deleteCurrentByIframe();
					}, 1500);
				}
			});
			return false;
		});
	});
</script>
</body>
</html>
