{inc:header.htm}
<div class="layuimini-container">
    <div class="layuimini-main">
        <div class="layui-card">
            <div class="layui-card-header">{@isset($data['id']) && $data['id'] ? '编辑主题' : '登记主题'}</div>
            <div class="layui-card-body">
                <!-- AJAX 提交：后端 E() 输出 {"err","msg"}，成功后自动关闭弹窗并刷新父页列表 -->
                <form id="form-theme-edit" class="layui-form" method="post" action="index.php?template_manager-theme_{@isset($action) ? $action : 'create'}_post-ajax-1">
                    <input type="hidden" name="FORM_HASH" value="{@form_hash()}" />
                    <input type="hidden" name="id" value="{@isset($data['id']) ? $data['id'] : 0}" />

                    <div class="layui-form-item">
                        <label class="layui-form-label">主题标识</label>
                        <div class="layui-input-block">
                            <input type="text" name="name" value="{@htmlspecialchars(isset($data['name']) ? $data['name'] : '', ENT_QUOTES, 'UTF-8')}" class="layui-input" placeholder="如 green-tech" {if:isset($data['id']) && $data['id']}readonly{/if} />
                            <div class="layui-form-mid layui-word-aux">对应 view/ 下的目录名，仅字母/数字/下划线/连字符</div>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">主题标题</label>
                        <div class="layui-input-block">
                            <input type="text" name="title" value="{@htmlspecialchars(isset($data['title']) ? $data['title'] : '', ENT_QUOTES, 'UTF-8')}" class="layui-input" placeholder="展示用名称，可中文" />
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">主题描述</label>
                        <div class="layui-input-block">
                            <textarea name="description" class="layui-textarea" rows="3" placeholder="主题用途、适用场景等备注">{@htmlspecialchars(isset($data['description']) ? $data['description'] : '', ENT_QUOTES, 'UTF-8')}</textarea>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">版本号</label>
                        <div class="layui-input-inline" style="width:200px;">
                            <input type="text" name="version" value="{@htmlspecialchars(isset($data['version']) && $data['version'] !== '' ? $data['version'] : '1.0.0', ENT_QUOTES, 'UTF-8')}" class="layui-input" />
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">设为默认</label>
                        <div class="layui-input-block">
                            <input type="checkbox" name="is_default" value="1" lay-skin="primary" title="设为默认主题" {if:isset($data['is_default']) && $data['is_default']}checked{/if} />
                            <div class="layui-form-mid layui-word-aux">勾选后同时切换站点当前主题（仅新建时生效）</div>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <div class="layui-input-block">
                            <button type="submit" lay-submit lay-filter="form-theme-edit" class="layui-btn layui-btn-normal"><i class="layui-icon">&#xe605;</i> 保存</button>
                            <button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.close(parent.layer.getFrameIndex(window.name));">取消</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
layui.use(['form', 'layer'], function () {
    var form = layui.form, layer = layui.layer;
    form.render();
    form.on('submit(form-theme-edit)', function () {
        adminAjax.postform('#form-theme-edit', function (data) {
            var json = typeof data === "object" ? data : toJson(data);
            layer.msg(json.msg, {icon: json.err == 0 ? 1 : 5});
            if (json.err == 0) {
                // 关闭自身 iframe 弹窗；父页面列表通过弹窗 end 回调自动刷新
                setTimeout(function () {
                    parent.layer.close(parent.layer.getFrameIndex(window.name));
                }, 800);
            }
        });
        return false;
    });
});
</script>
</body>
</html>
