{inc:header.htm}
<div class="layuimini-container">
	<div class="layuimini-main">
		<div class="layui-card">
			<div class="layui-card-header">编辑站点语言配置</div>
			<div class="layui-card-body">
				<form id="form" method="post" action="?language-edit_post-ajax-1" class="layui-form">
					<input type="hidden" name="FORM_HASH" value="{@form_hash()}" />
					<table class="layui-table">
						<thead>
							<tr>
								<th>语言</th>
								<th>显示名称</th>
								<th>默认语言</th>
								<th>启用</th>
								<th>子域名</th>
								<th>排序</th>
							</tr>
						</thead>
						<tbody>
							{loop:$all_languages $code $name}
							<tr>
								<td>{$code}</td>
								<td><input type="text" name="languages[{$code}][language_name]" value="{$name}" class="layui-input"></td>
								<td><input type="radio" name="languages[{$code}][is_default]" value="1" title="默认" lay-skin="primary" {if:$code=='zh'}checked{/if}></td>
								<td><input type="checkbox" name="languages[{$code}][is_enabled]" value="1" lay-skin="primary" {if:in_array($code, array('en','ja','ko'))}checked{/if}></td>
								<td><input type="checkbox" name="languages[{$code}][subdomain_enabled]" value="1" lay-skin="primary"></td>
								<td><input type="number" name="languages[{$code}][sort]" value="0" class="layui-input" style="width:80px"></td>
							</tr>
							{/loop}
						</tbody>
					</table>
					<div class="layui-form-item">
						<div class="layui-input-block">
							<button type="submit" class="layui-btn" lay-submit lay-filter="form">保存配置</button>
							<a class="layui-btn layui-btn-primary" href="?language-index">返回</a>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
<script>
layui.use(['form', 'layer', 'miniTab'], function(){
	var form = layui.form, layer = layui.layer, miniTab = layui.miniTab;
	form.render();

	//监听提交
	form.on('submit(form)', function () {
		adminAjax.postform('#form', function (data) {
			var json = toJson(data);
			layer.msg(json.msg, {icon: json.err == 0 ? 1 : 5});
			if (json.err == 0) {
				setTimeout(function () {
					miniTab.reloadIframe('index.php?language-index');
					miniTab.deleteCurrentByIframe();
				}, 1500);
			}
		});
		return false;
	});
});
</script>
</body>
</html>
