{inc:header.htm}
<style>
.softcate-set-card { max-width: 640px; }
.field-hint { display: block; color: #999; font-size: 12px; margin-top: 4px; line-height: 1.6; }
</style>
<div class="layuimini-container">
	<div class="layuimini-main">
		<div class="layui-card softcate-set-card">
			<div class="layui-card-header">
				<i class="layui-icon" style="color:#1E9FFF;">&#xe651;</i> {@$data['id'] > 0 ? '编辑分类' : '添加分类'}
			</div>
			<div class="layui-card-body">
				<form id="form" class="layui-form" action="?admin_softcate-set_post-ajax-1" method="post">
					<input type="hidden" name="FORM_HASH" value="{@form_hash()}" />
					<input type="hidden" name="id" value="{$data['id']}" />
					<input type="hidden" name="site_id" value="{$data['site_id']}" />

					<div class="layui-form-item">
						<label class="layui-form-label required">分类名称</label>
						<div class="layui-input-block">
							<input type="text" name="name" value="{$data['name']}" autocomplete="off" placeholder="例如：系统工具" class="layui-input" lay-verify="required" lay-reqtext="分类名称不能为空" />
						</div>
					</div>

					<div class="layui-form-item">
						<label class="layui-form-label">分类别名</label>
						<div class="layui-input-block">
							<input type="text" name="alias" value="{$data['alias']}" autocomplete="off" placeholder="例如：system-tools" class="layui-input" />
							<span class="field-hint">用于生成前台地址 /soft/cate-{别名}.html；留空时自动由分类名生成（拼音）。仅允许字母、数字、中划线</span>
						</div>
					</div>

					<div class="layui-form-item">
						<label class="layui-form-label">上级分类</label>
						<div class="layui-input-block" style="max-width:280px;">
							<select name="parent_id">
								<option value="0">无（一级分类）</option>
								{loop:$parents $p}
								<option value="{$p['id']}" {@$data['parent_id'] == $p['id'] ? 'selected' : ''}>{@htmlspecialchars($p['name'], ENT_QUOTES, 'UTF-8')}</option>
								{/loop}
							</select>
							<span class="field-hint">选择上级分类后，该分类作为二级栏目展示在软件分类导航中</span>
						</div>
					</div>

					<div class="layui-form-item">
						<label class="layui-form-label">分类简介</label>
						<div class="layui-input-block">
							<textarea name="intro" placeholder="分类简介，展示在分类页" class="layui-textarea" style="height:80px;">{$data['intro']}</textarea>
						</div>
					</div>

					<div class="layui-form-item" style="margin-top:22px;">
						<div class="layui-input-block">
							<button class="layui-btn" lay-submit lay-filter="form"><i class="layui-icon">&#xe605;</i> 保存</button>
							<a class="layui-btn layui-btn-primary" href="index.php?admin_softcate-index">返回列表</a>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
<script>
layui.use(['form','layer','jquery','miniTab'], function() {
	var layer = layui.layer, form = layui.form, $ = layui.jquery, miniTab = layui.miniTab;

	form.on('submit(form)', function() {
		adminAjax.postform('#form', function(data) {
			var json = toJson(data);
			layer.msg(json.message || json.msg, {icon: (json.status == 0 || json.err == 0) ? 1 : 5});
			if(json.status == 0 || json.err == 0) {
				setTimeout(function(){
					miniTab.reloadIframe('index.php?admin_softcate-index');
					miniTab.deleteCurrentByIframe();
				}, 1200);
			}
		});
		return false;
	});
});
</script>
</body>
</html>
