# Nginx 站点配置模板
# 创建新站点时使用此模板
# 替换 {DOMAIN} 和 {ROOT_PATH} 为实际值

server {
    listen 80;
    server_name {DOMAIN};

    root {ROOT_PATH};
    index index.php;

    # 包含伪静态规则
    include {ROOT_PATH}install/data/rewrite.conf;

    # 日志
    access_log {ROOT_PATH}log/access.log;
    error_log {ROOT_PATH}log/error.log;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
