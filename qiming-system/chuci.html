  <div class="tool-intro"><h2>楚辞起名：香草美人，男孩名字的气象之源</h2><p>《楚辞》以屈原《离骚》为代表，开中国浪漫主义文学之先河。香草美人的意象、瑰丽磅礴的句式，孕育了大量气宇轩昂的入名字材。</p><p>俗语说「男楚辞」，意指给男孩起名最适合从《楚辞》中取材。本专题收录《离骚》《九歌》《九章》《天问》中的名字素材，每个名字均标注出处与原句。</p><p>从「路漫漫其修远兮」的求索，到「青云衣兮白霓裳」的瑰丽，愿每个名字都带着《楚辞》的气象。</p></div></div></div>  <footer id="site-footer"></footer>
