  <div class="tool-intro"><h2>诗词起名：从经典撷取雅致好名</h2><p>诗词起名以中华经典诗词为灵感源泉，从《诗经》的温润、楚辞的瑰丽、唐诗的豪迈、宋词的婉约中提炼适合入名的优美字词，为宝宝打造兼具诗意与文化底蕴的名字。</p><p>「男楚辞，女诗经」是流传甚广的起名传统。本系统收录经典名句，标注出处与朝代，你可以从名句中直接摘取意象优美的字词组合，也可以按典籍分类浏览寻找灵感。</p><p>每一个出自诗词的名字，都自带一段可以讲给孩子听的来历——这正是诗词起名最动人的地方。</p></div></div></div>  <footer id="site-footer"></footer>
