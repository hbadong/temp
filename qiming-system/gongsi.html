<body>
  <header id="site-header"></header>  <div class="ink-banner"><div class="banner-inner">
    <span class="seal">企</span>
    <div class="bh">公司起名</div>
    <div class="sub">贴合业务定位，打造有记忆点的品牌标识</div>
  </div></div>
  <div class="hero"><div class="wrap form-card"><div class="form-panel">
    <form id="form-company" class="company-form" style="max-width:none;border:0;padding:0;background:transparent;">
      <label>公司所在地</label>
      <input id="cp-city" type="text" placeholder="如：杭州（选填，用于展示）">
      <label>所属行业</label>
      <select id="cp-industry"><option value="tech">科技 / 互联网</option><option value="trade">贸易 / 商贸</option><option value="food">餐饮 / 食品</option><option value="culture">文化 / 教育</option><option value="beauty">美妆 / 服饰</option><option value="health">健康 / 医疗</option><option value="build">建筑 / 地产</option><option value="finance">金融 / 投资</option></select>
      <label>核心字（选填，如品牌想要的字）</label>
      <input id="cp-core" type="text" placeholder="如：云、禾、颐，留空则自动组合" maxlength="1">
      <label>法人姓名与生日（选填，用于五行参考）</label>
      <div style="display:flex;gap:12px;">
        <input id="cp-legal" type="text" placeholder="法人姓名" style="flex:1;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;">
        <input id="cp-birth" type="date" style="flex:1;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;">
      </div>
      <button class="btn-primary" type="submit" style="letter-spacing:4px;">生成公司名称</button>
    </form>
  </div></div></div>
  <div class="wrap"><div id="company-result"></div></div>

  <div class="tool-intro"><h2>公司起名：贴合业务定位，打造品牌标识</h2><p>公司起名是企业初创或品牌布局的关键环节，需紧密结合业务领域、核心优势与市场定位，从名称中传递企业价值与发展愿景。</p><p>一个好的公司名称应当易读易记、行业属性清晰、具备商标注册的可行性。本系统按八大行业维度组织字库，结合吉祥数理与法人八字参考，生成兼具寓意与传播力的候选名称。</p><p>除名称本身，本页还同步给出配套的品牌建议，帮助你在创业起步阶段快速锁定心仪的名称方案。</p></div></div></div>  <footer id="site-footer"></footer>
