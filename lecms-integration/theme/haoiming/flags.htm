{inc:header.htm}

<div class="page-hero">
	<div class="wrap"><h1>推荐内容</h1><p>属性内容分页</p></div>
</div>

<div class="page-body wrap">
	{block:global_flags pagenum="10" dateformat="Y-m-d" showviews="1"}{/block}
	<div class="art-list">
		{loop:$gdata[list] $v}
		<a class="art-item" href="{$v[url]}">
			<div class="art-item-body">
				<h3>{$v[subject]}</h3>
				<div class="art-item-meta">{$v[date]} · 阅读 {$v[views]}</div>
			</div>
		</a>
		{/loop}
		{if:empty($gdata[list])}<p class="empty">暂无内容。</p>{/if}
		{if:$gdata[pages]}<div class="pagebar">{$gdata[pages]}</div>{/if}
	</div>
</div>

{inc:footer.htm}
