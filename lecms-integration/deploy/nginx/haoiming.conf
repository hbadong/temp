# ============================================================
# 好名网 · 生产 Nginx 站点配置
# ------------------------------------------------------------
# 适用：Ubuntu 22.04 + Nginx 1.24 + PHP 8.3-FPM + MySQL 8
# 放置：/etc/nginx/sites-available/haoiming → symlink 到 sites-enabled
# 调整项（部署时必须改）：
#   1. server_name          改成正式域名
#   2. root                  改成网站根目录（默认 /var/www/lecms）
#   3. fastcgi_pass          PHP-FPM socket 路径（按 php-fpm 实际版本）
#   4. /admin 白名单 IP      后台管理入口按运营者 IP 收紧
#   5. ssl_certificate       证书路径（正式域名 + 备案后启用 443 段）
# ============================================================

# ---------- 爬虫 UA 识别（与 gateway.php 的 $BOT_RE 保持一致） ----------
map $http_user_agent $is_bot {
    default 0;
    ~*(Baiduspider|Googlebot|Bingbot|360Spider|HaosouSpider|Sogou web spider|Sogou inst spider|YisouSpider|YandexBot|DuckDuckBot|facebookexternalhit|TwitterBot|Applebot|Bytespider|SemrushBot|AhrefsBot|PetalBot|GPTBot|ClaudeBot|CCBot|ia_archiver|archive\.org_bot|Yeti|NaverBot|Tegaki|Daum) 1;
}

# ---------- 上游定义 ----------
upstream php_fpm {
    server unix:/run/php/php8.3-fpm.sock;   # 按实际调整：php8.2/php8.3-fpm.sock 或 127.0.0.1:9000
}

server {
    listen 80;
    listen [::]:80;
    server_name ad6acb5cb3aeb83e6.app.workbuddy.link;   # ← 改正式域名

    root /var/www/lecms;                                 # ← 网站根目录
    index index.php index.html index.htm;

    # ---------- 安全响应头（全响应生效，与 gateway.php 双保险） ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- gzip（爬虫与浏览器均声明 Accept-Encoding: gzip） ----------
    gzip on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain application/xml;

    # ---------- 日志 ----------
    access_log /var/log/nginx/haoiming.access.log;
    error_log  /var/log/nginx/haoiming.error.log warn;

    # ---------- 上传体积（后台发布文章用） ----------
    client_max_body_size 32m;

    # ============================================================
    # 敏感目录禁外网访问
    # ============================================================
    location ^~ /lecms/    { deny all; }   # LECMS 框架内核
    location ^~ /install/  { deny all; }   # 安装器（部署后应删除）
    location ^~ /log/      { deny all; }   # 运行日志
    location ^~ /runcache/ { deny all; }   # 模板编译缓存
    location ~ /\.git      { deny all; }   # 版本库（如把 .git 带上服务器）
    location ~ /\.(?!well-known) { deny all; }

    # 后台管理入口：仅放行运营者 IP（部署时改成真实 IP，可多条 allow）
    location ^~ /admin {
        allow 127.0.0.1;
        allow 1.2.3.4;          # ← 改：运营者公网 IP
        deny all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================================
    # 动态工具页：静态文件优先；爬虫 UA 分流到预渲染网关
    # （正则 location 优先于 location /，普通用户与静态资源不受影响）
    # ============================================================
    location ~ ^/view/haoiming/tool/(char|surname|mingzi|faq|shengxiao|poems|shijing|chuci|tangshi|songci|baijiaxing|lib)\.html$ {
        if ($is_bot = 1) {
            rewrite ^ /__prerender_gateway last;   # 内部重写，$request_uri 保留原 URL
        }
        try_files $uri =404;
    }

    # 预渲染网关（internal：仅允许内部重写到达，外网直访 404）
    location = /__prerender_gateway {
        internal;
        fastcgi_pass php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/lecms/prerender/gateway.php;
        fastcgi_param HTTPS on;               # 反代终止 SSL 时让 PHP 感知 https
        fastcgi_read_timeout 60s;
    }

    # ============================================================
    # 静态资源分级缓存（与开发环境 router.php 策略对齐）
    # ============================================================
    # JS/CSS：全部带版本号（.7. 命名或 ?v=），30 天强缓存
    location ~* \.(js|css)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    # HTML 外壳：5 分钟必须重验证（内部引用均已带版本号）
    location ~* \.html?$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }
    # sitemap / robots：1 小时
    location ~* \.(xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    # 图片/字体/图标：30 天
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ============================================================
    # PHP 入口（LECMS 动态页：首页 / 文章 / 列表 / 后台）
    # ============================================================
    location ~ \.php$ {
        fastcgi_pass php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_read_timeout 60s;
    }

    # 其余请求：静态优先，回落 LECMS 入口（伪静态/路由）
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================================
    #  HTTPS 段（正式域名 + 证书就绪后启用）
    #  1) certbot --nginx -d your-domain.com
    #  2) 取消下面注释，并把 80 段改为 return 301
    # ============================================================
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
